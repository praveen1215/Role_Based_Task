
spring.application.name=role-based-task

# Local PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/role_based_task
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Backend port
server.port=8080
